name: regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [1.0---beta]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Applies every migration in supabase/migrations/ against a fresh
      # Postgres container — a broken migration fails the build right here,
      # before any test runs. Docker is preinstalled on ubuntu-latest
      # runners, and the `supabase` CLI is a pinned devDependency (installed
      # above by `npm ci`), so no extra setup action is needed.
      - name: Start local Supabase
        run: npx supabase start

      - name: Generate .env.test.local from the running local stack
        run: node scripts/write-test-env.js

      - name: Run unit tests
        run: npm run test:unit

      # test:db itself runs `db:reset` first for a guaranteed-clean slate —
      # this re-applies migrations a second time (already applied once by
      # `supabase start` above), a small, accepted redundancy for keeping
      # the exact same npm script used locally and in CI.
      - name: Run DB integration tests
        run: npm run test:db

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop
